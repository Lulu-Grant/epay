name: PHP 8.4 Compatibility

on:
  pull_request:
  push:
    branches:
      - main
      - 'upgrade/**'
      - 'codex/p5-shop-shadow-repair'
      - 'feature/p5-list-query-cache'

jobs:
  shop-browser:
    name: PHP 8.4 shop flow and browser
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cache: ['off', 'on', 'fault']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, curl, openssl, mbstring, gd, gmp, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated shop test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mariadb-server mariadb-client rsync
          npm install --prefix "$RUNNER_TEMP/shop-browser" playwright@1.51.1
          "$RUNNER_TEMP/shop-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Shop payment, compensation and browser acceptance
        env:
          SHOP_TEST_REQUIRE_BROWSER: '1'
          SHOP_TEST_LIST_CACHE_MODE: ${{ matrix.cache }}
          SHOP_TEST_LIST_BENCHMARK: ${{ matrix.cache == 'on' && '1' || '0' }}
          SHOP_TEST_NODE_PATH: ${{ runner.temp }}/shop-browser/node_modules
          SHOP_TEST_ARTIFACT_DIR: ${{ runner.temp }}/shop-acceptance
        run: SHOP_TEST_NODE_BIN="$(command -v node)" bash scripts/shop-feature-local-acceptance.sh
      - name: 100k list SQL, HTTP and responsive browser acceptance
        if: matrix.cache == 'on'
        env:
          LIST_TEST_REQUIRE_BROWSER: '1'
          LIST_TEST_NODE_PATH: ${{ runner.temp }}/shop-browser/node_modules
          LIST_TEST_ARTIFACT_DIR: ${{ runner.temp }}/list-acceptance
        run: LIST_TEST_NODE_BIN="$(command -v node)" bash scripts/list-query-local-acceptance.sh
      - name: Preserve shop browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shop-list-acceptance-${{ matrix.cache }}
          path: |
            ${{ runner.temp }}/shop-acceptance
            ${{ runner.temp }}/list-acceptance
  static-checks:
    name: PHP 8.4 static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, curl, openssl, json, mbstring, gd, fileinfo, session, gmp, bcmath, intl, zip, xml
          coverage: none

      - name: Check PHP environment
        run: php tools/php84/check-env.php

      - name: Lint PHP files
        run: sh tools/php84/lint-all.sh

      - name: Check blocked deprecated patterns
        run: sh tools/php84/check-deprecated-patterns.sh

      - name: Check plugin metadata
        run: php tools/php84/check-plugin-metadata.php

      - name: Check payment signatures
        run: php tools/php84/check-signatures.php

      - name: P5 repair regressions
        run: |
          php scripts/complaint-sync-regression.php
          php scripts/merchant-complaint-readonly-regression.php
          php scripts/roll-config-regression.php
          php scripts/email-integrity-regression.php
          php scripts/registration-completion-regression.php
          php scripts/admin-sso-regression.php
          php scripts/payment-callback-regression.php
          php scripts/order-number-regression.php
          php scripts/ui-contract-regression.php
          php scripts/list-read-cache-regression.php

      - name: Check download endpoint safety
        run: php tools/php84/check-download-safety.php

      - name: Check rewrite rules
        run: php tools/php84/check-rewrite-rules.php

      - name: HTTP smoke checks
        run: sh tools/php84/http-smoke.sh

      - name: Composer install and platform checks
        run: sh tools/php84/composer-check.sh

      - name: Composer security audit
        run: composer audit --working-dir=includes --no-dev

  database-fixture:
    name: PHP 8.4 database fixture
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: epay_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pepay_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, curl, openssl, json, mbstring, gd, fileinfo, session, gmp, bcmath, intl, zip, xml
          coverage: none

      - name: Database fixture check
        env:
          EPAY_DB_HOST: 127.0.0.1
          EPAY_DB_PORT: 3306
          EPAY_DB_USER: root
          EPAY_DB_PASSWORD: epay_test
        run: php tools/php84/db-fixture-check.php

      - name: Rollback rehearsal check
        env:
          EPAY_DB_HOST: 127.0.0.1
          EPAY_DB_PORT: 3306
          EPAY_DB_USER: root
          EPAY_DB_PASSWORD: epay_test
        run: php tools/php84/rollback-rehearsal-check.php

      - name: Shop mixed charset and performance regression
        env:
          EPAY_DB_HOST: 127.0.0.1
          EPAY_DB_PORT: 3306
          EPAY_DB_USER: root
          EPAY_DB_PASSWORD: epay_test
        run: php tools/php84/shop-repair-check.php

      - name: Installed HTTP smoke checks
        env:
          EPAY_DB_HOST: 127.0.0.1
          EPAY_DB_PORT: 3306
          EPAY_DB_USER: root
          EPAY_DB_PASSWORD: epay_test
          EPAY_SMOKE_PORT: 8097
        run: sh tools/php84/installed-http-smoke.sh

      - name: Install and upgrade smoke checks
        env:
          EPAY_DB_HOST: 127.0.0.1
          EPAY_DB_PORT: 3306
          EPAY_DB_USER: root
          EPAY_DB_PASSWORD: epay_test
          EPAY_INSTALL_SMOKE_PORT: 8099
        run: sh tools/php84/install-upgrade-smoke.sh
